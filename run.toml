schema_version = 1
seed = 20261102
report_dir = "reports/stage0"

[dataset]
id = "uci-appliances-energy"
title = "Appliances Energy Prediction"
url = "https://archive.ics.uci.edu/static/public/374/appliances%2Benergy%2Bprediction.zip"
homepage = "https://archive.ics.uci.edu/dataset/374/appliances+energy+prediction"
doi = "10.24432/C5VC8G"
citation = "Candanedo, L. (2017). Appliances Energy Prediction [Dataset]. UCI Machine Learning Repository."
license = "CC-BY-4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
archive_sha256 = "2fccf354445d886e7917620b0195db1f3e3e34d5a067a93b844694a4c561255a"
member = "energydata_complete.csv"
manifest = "datasets/appliances/manifest.json"
cache = ".cache/datasets/appliances-energy-prediction.zip"
development_dir = "data/development/appliances"
sealed_dir = "data/sealed/appliances"
max_download_bytes = 20971520
max_source_bytes = 33554432

[split]
method = "chronological-day-groups"
train_fraction = 0.6
validation_fraction = 0.2
gap_days = 1
chunk_bytes = 262144

[lab]
profile_bytes = 262144
baseline_probe_bytes = 65536
max_input_bytes = 2097152
dictionary_bytes = 8192
dictionary_samples = 16
dictionary_sample_bytes = 65536

[limits]
baseline_timeout_seconds = 120
baseline_memory_mib = 2048
candidate_encode_timeout_seconds = 30
candidate_decode_timeout_seconds = 10
candidate_memory_mib = 256
candidate_max_output_bytes = 4194304
candidate_min_decode_mib_per_second = 10.0

[objective]
minimum_archive_gain = 0.10
score = "complete archive bytes; count headers, raw escapes, exceptions, and shared model once per corpus"
deployment_score = "baseline archive bytes - candidate archive bytes - incremental decoder package bytes"
test_policy = "one frozen candidate; test data never mounted into coder or search workers"

[budget]
total_usd = 150
framework_usd = 30
discovery_usd = 80
refinement_usd = 20
reserve_usd = 20
initial_candidates = 12
evolved_candidates = 12
repair_sessions = 4
plateau_rounds = 3
provider_spending_cap_verified = false
# Stage 0 performs authenticated GET /models only. No model inference.
generation_enabled = false

[coder]
model = "muse-spark-1.3"
api_key_env = "META_API_KEY"
api_base = "https://api.meta.ai/v1"
executable = ".tools/bin/muse-bin-1.4.14-R7309.1"
timeout_seconds = 300
max_model_steps = 6
command = ["{executable}", "exec", "--provider", "meta", "--model", "{model}", "--max-model-steps", "{max_model_steps}", "--prompt-file", "{prompt_file}", "--workspace", "{workspace}", "--json", "--contributor-mode", "off", "--disable-web-tools", "--disable-reminders", "--no-foreign-personal-context", "--disable-request-user-input", "--approval-mode", "never", "--approval-judge", "off"]

[[baselines]]
id = "gzip-9"
encode = ["gzip", "-n", "-9", "-c"]
decode = ["gzip", "-d", "-c"]

[[baselines]]
id = "xz-9e"
encode = ["xz", "-9e", "--threads=1", "--check=crc64", "-c"]
decode = ["xz", "-d", "-c"]

[[baselines]]
id = "zstd-19"
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "-19", "-c"]
decode = ["zstd", "-q", "-d", "-c"]

[[baselines]]
id = "zstd-22"
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "--ultra", "-22", "-c"]
decode = ["zstd", "-q", "-d", "-c"]

[[baselines]]
id = "zstd-dict-19"
dictionary = true
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "-19", "-D", "{dictionary}", "-c"]
decode = ["zstd", "-q", "-D", "{dictionary}", "-d", "-c"]

[[baselines]]
id = "zstd-dict-22"
dictionary = true
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "--ultra", "-22", "-D", "{dictionary}", "-c"]
decode = ["zstd", "-q", "-D", "{dictionary}", "-d", "-c"]
