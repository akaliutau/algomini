schema_version = 1
seed = 20261102
report_dir = ".cache/preflight"

# Schema-1 compatibility validation; cloud partitions are recorded in sampling.json.
[split]
method = "chronological-day-groups"
train_fraction = 0.6
validation_fraction = 0.2
gap_days = 1
chunk_bytes = 262144

[lab]
profile_bytes = 262144
baseline_probe_bytes = 65536
max_input_bytes = 2097152
dictionary_bytes = 8192
dictionary_samples = 16
dictionary_sample_bytes = 65536

[limits]
file_max_input_bytes = 67108864
file_memory_mib = 1024
baseline_timeout_seconds = 120
baseline_memory_mib = 2048
candidate_encode_timeout_seconds = 30
candidate_decode_timeout_seconds = 10
candidate_memory_mib = 256
candidate_max_output_bytes = 4194304
candidate_min_decode_mib_per_second = 10.0

[objective]
minimum_archive_gain = 0.10
score = "complete archive bytes; count headers, raw escapes, exceptions, and shared model once per corpus"
deployment_score = "baseline archive bytes - candidate archive bytes - incremental decoder package bytes"
test_policy = "one frozen candidate; test data never mounted into coder or search workers"

[evaluation]
schema_version = 1
probe_positions = [0.0, 0.5, 1.0]
probe_bytes = 262144
decode_repetitions = 3
timing = "parent ready-to-exit; fresh process per repetition; isolation setup reported separately"
rss = "wait4 maximum RSS including the isolation launcher; address space capped by RLIMIT_AS"
collection_format = "ALC1; method id, block labels/lengths, shared model, and complete frames counted"

[budget]
total_usd = 150
framework_usd = 30
discovery_usd = 80
refinement_usd = 20
reserve_usd = 20
initial_candidates = 12
evolved_candidates = 12
repair_sessions = 4
plateau_rounds = 3
provider_spending_cap_verified = true
provider_spending_cap_evidence = "User confirmed a $150 provider limit before Stage 1"
generation_enabled = true
attempt_reservation_usd = 5
stage1_max_attempts = 7

[pricing]
source = "https://dev.meta.ai/docs/pricing-rate-limits"
model = "muse-spark-1.3"
input_usd_per_million = 1.25
cached_input_usd_per_million = 0.15
output_usd_per_million = 4.25

[pricing.models."muse-wonder-1.0"]
input_usd_per_million = 4.00
cached_input_usd_per_million = 0.20
output_usd_per_million = 20.00

[coder]
model = "muse-spark-1.3"
reasoning_effort = "high"
api_key_env = "META_API_KEY"
api_base = "https://api.meta.ai/v1"
executable = ".tools/bin/muse-bin-1.4.14-R7309.1"
timeout_seconds = 600
max_model_steps = 32
trace_transport = false
excerpt_bytes = 16384
command = ["{executable}", "exec", "--provider", "meta", "--model", "{model}", "--reasoning-effort", "{reasoning_effort}", "--max-model-steps", "{max_model_steps}", "--prompt-file", "{prompt_file}", "--workspace", "{workspace}", "--json", "--contributor-mode", "off", "--disable-shell", "--disable-web-tools", "--disable-reminders", "--no-foreign-personal-context", "--disable-request-user-input", "--approval-mode", "never", "--approval-judge", "off", "-c", "agents.execution_capacity=1"]

[coder.profiles.evolved]
model = "muse-wonder-1.0"
reasoning_effort = "max"

[coder.profiles.repair]
model = "muse-wonder-1.0"
reasoning_effort = "high"

[[baselines]]
id = "gzip-9"
encode = ["gzip", "-n", "-9", "-c"]
decode = ["gzip", "-d", "-c"]

[[baselines]]
id = "xz-9e"
encode = ["xz", "-9e", "--threads=1", "--check=crc64", "-c"]
decode = ["xz", "-d", "-c"]

[[baselines]]
id = "zstd-19"
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "-19", "-c"]
decode = ["zstd", "-q", "-d", "-c"]

[[baselines]]
id = "zstd-22"
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "--ultra", "-22", "-c"]
decode = ["zstd", "-q", "-d", "-c"]

[[baselines]]
id = "zstd-dict-19"
dictionary = true
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "-19", "-D", "{dictionary}", "-c"]
decode = ["zstd", "-q", "-D", "{dictionary}", "-d", "-c"]

[[baselines]]
id = "zstd-dict-22"
dictionary = true
encode = ["zstd", "-q", "-T1", "--stream-size={input_bytes}", "--ultra", "-22", "-D", "{dictionary}", "-c"]
decode = ["zstd", "-q", "-D", "{dictionary}", "-d", "-c"]
