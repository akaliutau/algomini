[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "algomini"
version = "0.2.0"
description = "Bounded research laboratory for reproducible compression experiments"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
coder = ["python-dotenv==1.2.4"]
memory = ["model2vec==0.10.0"]
test = ["pytest==9.2.0", "PyYAML==6.0.3"]

[project.scripts]
algomini-lab = "algomini.cli:main"

[tool.setuptools.packages.find]
include = ["algomini*"]
