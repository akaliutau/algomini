name: Build a compression codec
description: Run bounded development and one final benchmark, then propose a codec PR.
title: "[codec] "
labels: [codec-request]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin name
      description: Logical lowercase name to create or extend, for example wiki-xml.
      placeholder: wiki-xml
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset manifest URL
      description: Public raw.githubusercontent.com URL pinned to a full commit; JSON must name different train/test files, byte counts, SHA-256 checksums and provenance.
      placeholder: https://raw.githubusercontent.com/OWNER/datasets/FULL_COMMIT/manifest.json
    validations:
      required: true
