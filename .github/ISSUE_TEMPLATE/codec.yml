name: Develop a compression plugin
description: Supply a plugin name and a ZIP dataset; receive benchmark results and a qualified PR.
title: "[codec] Develop plugin"
labels: [codec-request]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin name
      description: Lowercase name to create or extend. The workflow adds it to this issue's title automatically.
      placeholder: json-v1
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset archive URL
      description: Public ZIP URL on raw.githubusercontent.com, pinned to a full commit. Include at least two data files; the larger of two trains, otherwise files split about 70:30. Each partition may be up to 64 MiB; research uses its first 2 MiB. A manifest is generated automatically.
      placeholder: https://raw.githubusercontent.com/OWNER/datasets/FULL_COMMIT/samples.zip
    validations:
      required: true
