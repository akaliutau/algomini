name: Release qualified codecs
on:
  push:
    branches: [main]
    paths: ['release/registry.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: algomini-release
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ready: ${{ steps.plan.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        run: |
          python - <<'PY'
          import json,os
          from algomini.cloud.contracts import IMAGE,SLUG
          entries=json.load(open('release/registry.json')).get('requests',[])
          for entry in entries:
              if not SLUG.fullmatch(entry['id']) or not IMAGE.fullmatch(entry['image']):
                  raise ValueError('Invalid release matrix entry')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'request':entries},separators=(',',':'))+'\n')
              out.write('ready='+str(bool(entries)).lower()+'\n')
          PY
  build:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Rebuild exact qualified snapshot, never read final data
        env:
          GHCR_TOKEN: ${{ github.token }}
          LAB_IMAGE: ${{ matrix.request.image }}
          ALGOMINI_RELEASE_REQUEST: ${{ matrix.request.id }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/release-work" "$RUNNER_TEMP/release-output"
          chmod 0777 "$RUNNER_TEMP/release-work" "$RUNNER_TEMP/release-output"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 4g \
            --tmpfs /tmp:rw,nosuid,size=512m -e ALGOMINI_RELEASE_REQUEST \
            -v "$GITHUB_WORKSPACE:/library:ro" -v "$RUNNER_TEMP/release-work:/work" -v "$RUNNER_TEMP/release-output:/out" \
            "$LAB_IMAGE" python -m algomini.cloud --library /library release-build --output /out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.request.id }}
          path: ${{ runner.temp }}/release-output/
          retention-days: 90
  publish:
    needs: [plan, build]
    if: always() && needs.plan.outputs.ready == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/releases
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.ALGOMINI_APP_CLIENT_ID || secrets.ALGOMINI_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALGOMINI_APP_PRIVATE_KEY }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: python -m algomini.cloud release-publish --output "$RUNNER_TEMP/releases"
